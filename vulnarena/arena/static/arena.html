<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VulnArena · AI Cyber Arena</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #111725; --panel-2: #0e1420; --line: #1e2637;
    --text: #c9d4e5; --muted: #7c8aa5; --dim: #55617a;
    --blue: #4f8cff; --green: #35d07f; --red: #ff5d6c; --amber: #f5b942; --purple: #a97bff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #16203a 0%, var(--bg) 55%);
    color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  code, pre, .mono { font-family: "Cascadia Code", Consolas, "Courier New", monospace; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: rgba(12,16,24,.8);
    position: sticky; top: 0; z-index: 5; backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .3px; }
  .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
  .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sid { color: var(--muted); font-size: 12px; }
  .sid b { color: var(--text); font-weight: 600; }

  .pill {
    font-size: 11px; letter-spacing: .6px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); text-transform: uppercase;
  }
  .pill.run { color: var(--amber); border-color: #4a3a12; background: #241c08; }
  .pill.ok { color: var(--green); border-color: #16452f; background: #0c2118; }
  .pill.bad { color: var(--red); border-color: #4a1a20; background: #240d11; }

  button {
    font: inherit; color: #06121f; background: var(--blue); border: 0; border-radius: 8px;
    padding: 8px 16px; font-weight: 600; cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { background: #24304a; color: var(--dim); cursor: not-allowed; }

  main {
    display: grid; grid-template-columns: 260px minmax(0, 1fr) 380px;
    gap: 16px; padding: 16px 22px 40px; align-items: start;
  }
  @media (max-width: 1180px) { main { grid-template-columns: 1fr; } }

  .col { min-width: 0; }
  h2 {
    font-size: 12px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase;
    margin: 0 0 10px; font-weight: 600;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }

  /* stages */
  .stages { list-style: none; margin: 0; padding: 0; }
  .stages li {
    display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 9px;
    color: var(--dim); border: 1px solid transparent;
  }
  .stages li .idx {
    width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 11px; flex: none; color: var(--dim);
  }
  .stages li .txt small { display: block; color: var(--dim); font-size: 11px; }
  .stages li.active { color: var(--text); background: #131c2e; border-color: #22314d; }
  .stages li.active .idx { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 8px #f5b94255; }
  .stages li.done { color: var(--text); }
  .stages li.done .idx { border-color: var(--green); color: var(--green); }
  .stages li.fail .idx { border-color: var(--red); color: var(--red); }

  .stat { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .stat span:first-child { color: var(--muted); }
  .stat b { font-variant-numeric: tabular-nums; }

  /* traces */
  .feed { display: flex; flex-direction: column; gap: 10px; }
  .empty {
    border: 1px dashed var(--line); border-radius: 12px; padding: 40px 20px; text-align: center;
    color: var(--dim);
  }
  .trace { border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); overflow: hidden; }
  .trace .head {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .trace .step { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .trace .label { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trace .ms { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .badge { font-size: 10.5px; letter-spacing: .6px; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  .badge.ok { color: #0a1a12; background: var(--green); }
  .badge.waf { color: #1a1205; background: var(--amber); }
  .badge.breach { color: #1a0508; background: var(--red); }
  .badge.authz { color: #150a1f; background: var(--purple); }
  .trace .body { padding: 10px 12px; }
  .reason { color: var(--muted); font-size: 13px; }
  .req {
    margin-top: 8px; padding: 8px 10px; background: #0a0f19; border: 1px solid var(--line);
    border-radius: 8px; color: #9fb0c9; font-size: 12px; word-break: break-all; max-height: 92px;
    overflow: auto;
  }
  .req b { color: var(--blue); }

  /* patch */
  .kv { display: flex; gap: 8px; font-size: 13px; padding: 3px 0; }
  .kv span:first-child { color: var(--muted); min-width: 74px; }
  .kv code { color: #9fb0c9; word-break: break-all; }
  .meters { display: flex; gap: 8px; margin-top: 10px; }
  .meter { flex: 1; background: #0a0f19; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
  .meter b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .meter small { color: var(--dim); font-size: 11px; }
  pre.diff {
    margin: 10px 0 0; padding: 10px; background: #080d15; border: 1px solid var(--line);
    border-radius: 9px; font-size: 11.5px; line-height: 1.55; max-height: 320px; overflow: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  pre.diff .add { color: #7ee2a8; display: block; }
  pre.diff .del { color: #ff8d97; display: block; }
  pre.diff .hunk { color: var(--blue); display: block; }
  pre.diff .meta { color: var(--dim); display: block; }
  pre.diff .ctx { color: #8a99b3; display: block; }

  .toast { color: var(--red); font-size: 12px; margin-top: 8px; }
  .hidden { display: none !important; }

  button.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500;
  }
  button.ghost:hover { border-color: var(--blue); color: var(--blue); }
  a.link { font: inherit; color: var(--text); text-decoration: none; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; }
  a.link:hover { border-color: var(--blue); color: var(--blue); }
  button.ghost:disabled { color: var(--dim); border-color: var(--line); background: transparent; }

  .scrim {
    position: fixed; inset: 0; background: #05070bd0; opacity: 0; pointer-events: none;
    transition: opacity .18s; z-index: 20;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(700px, 96vw);
    background: #0c111c; border-left: 1px solid var(--line); z-index: 21;
    transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  .drawer > header { position: static; }
  .drawer .body { overflow: auto; padding: 16px 18px 40px; }
  .step {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2);
    margin-bottom: 12px; overflow: hidden;
  }
  .step.done { opacity: .55; }
  .step .bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .step .bar input { accent-color: var(--green); width: 15px; height: 15px; }
  .step .bar .n { color: var(--dim); font-variant-numeric: tabular-nums; }
  .step .bar .t { font-weight: 600; flex: 1; min-width: 0; }
  .step .bar .exp { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .step .cnt { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .step .intent { color: var(--muted); }
  .step .brief { color: var(--text); }
  .step .brief b { color: var(--amber); font-weight: 600; }
  .step .hint { color: #b9c7dd; background: #101a2b; border: 1px dashed #2a3a55; border-radius: 8px; padding: 8px 10px; }
  .step .hint b { color: var(--blue); font-weight: 600; }
  .step .tools { display: flex; gap: 8px; }
  .step .tools button.reveal { font-size: 12px; padding: 4px 12px; }
  .step .commands { display: flex; flex-direction: column; gap: 8px; }
  .step .answer { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .step .expect { font-size: 12.5px; color: #9fb0c9; }
  .step .expect b { color: var(--green); }
  .step .note { font-size: 12.5px; color: var(--muted); }
  .step .note b { color: var(--blue); font-weight: 600; }
  .code { position: relative; background: #070b13; border: 1px solid var(--line); border-radius: 9px; }
  .code pre {
    margin: 0; padding: 10px 12px; font-size: 11.5px; line-height: 1.55; overflow: auto;
    color: #9fb0c9; white-space: pre-wrap; word-break: break-all;
  }
  .code .copy {
    position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: #1b2436; color: var(--muted); border: 0; cursor: pointer;
  }
  .code .copy:hover { color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> VulnArena · AI Cyber Arena
    <small>红蓝对抗演练台</small></div>
  <div class="meta">
    <span class="sid">会话 <b id="sid">—</b></span>
    <span class="pill" id="status">IDLE</span>
    <a class="ghost link" href="/api/procure/ui/login" target="_blank">靶场前台</a>
    <button id="review" class="ghost" disabled>复盘</button>
    <button id="guide" class="ghost" disabled>跟练</button>
    <button id="start">开始演练</button>
  </div>
</header>

<main>
  <aside class="col">
    <h2>演练阶段</h2>
    <div class="card">
      <ol class="stages" id="stages">
        <li data-stage="0"><span class="idx">1</span><span class="txt">布防<small>开启缺陷 · 预置薄弱规则</small></span></li>
        <li data-stage="1"><span class="idx">2</span><span class="txt">攻击<small>四步链 · 变形绕过</small></span></li>
        <li data-stage="2"><span class="idx">3</span><span class="txt">修复<small>规则过闸门 · 代码 diff</small></span></li>
        <li data-stage="3"><span class="idx">4</span><span class="txt">回归<small>攻击全拦 · 业务零误杀</small></span></li>
      </ol>
    </div>
    <h2>指标</h2>
    <div class="card" id="stats">
      <div class="stat"><span>规则召回</span><b id="m-recall">—</b></div>
      <div class="stat"><span>规则误杀</span><b id="m-fp">—</b></div>
      <div class="stat"><span>攻击拦截</span><b id="m-atk">—</b></div>
      <div class="stat"><span>正常放行</span><b id="m-ben">—</b></div>
    </div>
  </aside>

  <section class="col">
    <h2>攻击链实时回放</h2>
    <div class="feed" id="feed">
      <div class="empty" id="empty">还没有演练。点右上角「开始演练」，这里会实时滚动红队的每一步。</div>
    </div>
  </section>

  <aside class="col">
    <h2>蓝队修复</h2>
    <div class="card" id="patch-card">
      <div class="empty" style="padding:22px 12px">等待红队击穿后自动生成</div>
    </div>
  </aside>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="跟练脚本">
  <header>
    <div class="brand" style="font-size: 14px"><span class="dot"></span> <span id="drawer-title">跟练模式</span></div>
    <div class="meta">
      <button class="ghost" id="restore">复原到未修复</button>
      <button class="ghost" id="patch">应用补丁</button>
      <button class="ghost" id="close-guide">关闭</button>
    </div>
  </header>
  <div class="body" id="guide-body">
    <div class="empty">先跑一场演练，这里会生成可以照着敲的步骤。</div>
  </div>
</aside>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const feed = $("feed"), stages = [...document.querySelectorAll(".stages li")];
  let source = null;
  let currentSession = null;

  const setStatus = (text, cls = "") => {
    const el = $("status");
    el.textContent = text;
    el.className = "pill " + cls;
  };
  const setStage = (index, state) => {
    const li = stages[index];
    if (!li) return;
    li.classList.remove("active", "done", "fail");
    if (state) li.classList.add(state);
  };
  const resetStages = () => stages.forEach((li) => li.classList.remove("active", "done", "fail"));
  const clearFeed = () => { feed.innerHTML = ""; };

  function traceCard(trace) {
    const wrap = document.createElement("article");
    const cls = trace.canary_hit ? "breach" : trace.status === 403
      ? (trace.blocked_by === "waf" ? "waf" : "authz") : "ok";
    wrap.className = "trace";

    const head = document.createElement("div");
    head.className = "head";
    head.innerHTML =
      `<span class="step">STEP ${String(trace.step).padStart(2, "0")}</span>` +
      `<span class="label"></span>` +
      `<span class="badge ${cls}">${trace.canary_hit ? "BREACH"
        : trace.status === 403 ? (trace.blocked_by === "waf" ? "WAF BLOCK" : "DENIED") : "OK"}</span>` +
      `<span class="ms">${trace.elapsed_ms} ms</span>`;
    head.querySelector(".label").textContent = trace.label;

    const body = document.createElement("div");
    body.className = "body";
    const reason = document.createElement("div");
    reason.className = "reason";
    reason.textContent = trace.reasoning || "";
    const req = document.createElement("div");
    req.className = "req";
    const call = trace.call || {};
    const qs = call.params && Object.keys(call.params).length
      ? "?" + new URLSearchParams(call.params).toString() : "";
    req.innerHTML = `<b>${call.method || "GET"}</b> `;
    req.appendChild(document.createTextNode(`${call.path || ""}${qs}`));
    if (trace.rule_id) {
      const tag = document.createElement("div");
      tag.style.marginTop = "6px";
      tag.style.color = "#7c8aa5";
      tag.textContent = `命中规则 ${trace.rule_id}`;
      req.appendChild(tag);
    }
    body.append(reason, req);
    wrap.append(head, body);
    return wrap;
  }

  function renderDiff(text) {
    const pre = document.createElement("pre");
    pre.className = "diff";
    for (const line of (text || "").split("\n")) {
      const span = document.createElement("span");
      span.textContent = line || " ";
      if (line.startsWith("+++") || line.startsWith("---")) span.className = "meta";
      else if (line.startsWith("@@")) span.className = "hunk";
      else if (line.startsWith("+")) span.className = "add";
      else if (line.startsWith("-")) span.className = "del";
      else span.className = "ctx";
      pre.appendChild(span);
    }
    return pre;
  }

  function renderPatch(patch) {
    const card = $("patch-card");
    card.innerHTML = "";
    const kv = (label, value) => {
      const row = document.createElement("div");
      row.className = "kv";
      const k = document.createElement("span"); k.textContent = label;
      const v = document.createElement("code"); v.textContent = value;
      row.append(k, v);
      return row;
    };
    const rules = patch.rules && patch.rules.length ? patch.rules : patch.rule ? [patch.rule] : [];
    if (rules.length) {
      rules.forEach((rule) => card.append(kv("WAF 规则", `${rule.id}  ${rule.regex}`)));
    } else {
      card.append(kv("WAF 规则", "闸门否决，未下发"));
    }
    card.append(kv("代码修复", (patch.switched_flags || []).join(", ") || "无"));

    if (patch.gate) {
      const meters = document.createElement("div");
      meters.className = "meters";
      meters.innerHTML =
        `<div class="meter"><b>${Math.round(patch.gate.recall * 100)}%</b><small>攻击召回</small></div>` +
        `<div class="meter"><b>${Math.round(patch.gate.false_positive * 100)}%</b><small>正常误杀</small></div>`;
      card.append(meters);
      $("m-recall").textContent = Math.round(patch.gate.recall * 100) + "%";
      $("m-fp").textContent = Math.round(patch.gate.false_positive * 100) + "%";
    }
    if (patch.rationale) {
      const p = document.createElement("div");
      p.className = "reason";
      p.style.marginTop = "10px";
      p.textContent = patch.rationale;
      card.append(p);
    }
    if (patch.diff) card.append(renderDiff(patch.diff));
  }

  function handle(event) {
    switch (event.kind) {
      case "blueprint":
        resetStages(); setStage(0, "done"); setStage(1, "active");
        setStatus("PROBING", "run");
        break;
      case "trace": {
        $("empty")?.remove();
        feed.appendChild(traceCard(event.data));
        feed.lastElementChild.scrollIntoView({ behavior: "smooth", block: "nearest" });
        break;
      }
      case "breach":
        setStage(1, "done"); setStage(2, "active");
        setStatus("PATCHING", "run");
        break;
      case "patch":
        renderPatch(event.data);
        setStage(2, "done"); setStage(3, "active");
        setStatus("VERIFYING", "run");
        break;
      case "verified":
      case "regression_failed":
      case "breach_failed": {
        const bad = event.kind !== "verified";
        if (event.data) {
          $("m-atk").textContent = `${event.data.attack_blocked}/${event.data.attack_total}`;
          $("m-ben").textContent = `${event.data.benign_allowed}/${event.data.benign_total}`;
        }
        setStage(3, bad ? "fail" : "done");
        setStatus(event.kind.replace("_", " ").toUpperCase(), bad ? "bad" : "ok");
        $("start").disabled = false;
        break;
      }
      case "error":
        setStatus("ERROR", "bad");
        $("start").disabled = false;
        break;
    }
  }

  function connect(sessionId) {
    if (source) source.close();
    currentSession = sessionId;
    $("sid").textContent = sessionId;
    $("guide").disabled = false;
    $("review").disabled = false;
    source = new EventSource(`/api/arena/stream/${sessionId}`);
    source.onmessage = (message) => handle(JSON.parse(message.data));
    source.onerror = () => setStatus("DISCONNECTED", "bad");
  }

  async function start() {
    $("start").disabled = true;
    clearFeed();
    resetStages();
    setStage(0, "active");
    setStatus("STARTING", "run");
    ["m-recall", "m-fp", "m-atk", "m-ben"].forEach((id) => ($(id).textContent = "—"));
    $("patch-card").innerHTML = '<div class="empty" style="padding:22px 12px">等待红队击穿后自动生成</div>';
    try {
      const response = await fetch("/api/arena/start", { method: "POST" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const { session_id } = await response.json();
      connect(session_id);
    } catch (error) {
      setStatus("ERROR", "bad");
      $("start").disabled = false;
      feed.innerHTML = `<div class="empty">启动失败：${error.message}</div>`;
    }
  }

  async function boot() {
    try {
      const sessions = await (await fetch("/api/arena/sessions")).json();
      if (sessions.length) {
        $("start").disabled = false;
        connect(sessions[0].session_id);
      }
    } catch { /* first load before any session is normal */ }
  }

  async function copyText(text, button) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    const label = button.textContent;
    button.textContent = "已复制";
    setTimeout(() => (button.textContent = label), 1200);
  }

  function codeBlock(text) {
    const wrap = document.createElement("div");
    wrap.className = "code";
    const pre = document.createElement("pre");
    pre.textContent = text;
    const button = document.createElement("button");
    button.className = "copy";
    button.textContent = "复制";
    button.addEventListener("click", () => copyText(text, button));
    wrap.append(pre, button);
    return wrap;
  }

  function labelled(prefix, value, cls) {
    const row = document.createElement("div");
    row.className = cls;
    row.append(document.createTextNode(prefix));
    const strong = document.createElement("b");
    strong.textContent = value;
    row.append(strong);
    return row;
  }

  function stepCard(step, doneMap) {
    const card = document.createElement("article");
    card.className = "step";

    const bar = document.createElement("div");
    bar.className = "bar";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = Boolean(doneMap[step.index]);
    const index = document.createElement("span");
    index.className = "n";
    index.textContent = `#${step.index}`;
    const title = document.createElement("span");
    title.className = "t";
    title.textContent = step.title;
    const expect = document.createElement("span");
    expect.className = "exp";
    expect.textContent = `预期 ${step.expected_status}`;
    bar.append(box, index, title, expect);

    // L1：任务，永远可见
    const brief = labelled("任务：", step.brief || step.intent, "brief");

    // L2：思路，点「提示」才出现
    const hintBlock = labelled("思路：", step.hint || step.intent, "hint");
    hintBlock.classList.add("hidden");
    const hintBtn = document.createElement("button");
    hintBtn.className = "ghost reveal";
    hintBtn.textContent = "提示";

    // L3：命令，点「命令」才出现
    const commandBlock = document.createElement("div");
    commandBlock.className = "commands hidden";
    commandBlock.append(codeBlock(step.powershell), codeBlock(step.curl));
    const cmdBtn = document.createElement("button");
    cmdBtn.className = "ghost reveal";
    cmdBtn.textContent = "命令";

    // 做完再对答案
    const answer = document.createElement("div");
    answer.className = "answer hidden";
    answer.append(
      labelled("看到什么算成功：", step.expected_marker, "expect"),
      labelled("为什么能打通：", step.explanation, "note"),
      labelled("蓝队怎么防：", step.defense_note, "note"),
    );

    const tools = document.createElement("div");
    tools.className = "tools";
    tools.append(hintBtn, cmdBtn);

    const body = document.createElement("div");
    body.className = "cnt";
    body.append(brief, hintBlock, tools, commandBlock, answer);

    hintBtn.addEventListener("click", () => {
      hintBlock.classList.toggle("hidden");
      hintBtn.textContent = hintBlock.classList.contains("hidden") ? "提示" : "收起提示";
    });
    cmdBtn.addEventListener("click", () => {
      commandBlock.classList.toggle("hidden");
      cmdBtn.textContent = commandBlock.classList.contains("hidden") ? "命令" : "收起命令";
    });

    box.addEventListener("change", () => {
      doneMap[step.index] = box.checked;
      card.classList.toggle("done", box.checked);
      answer.classList.toggle("hidden", !box.checked);
      localStorage.setItem(`arena:guide:${currentSession}`, JSON.stringify(doneMap));
    });
    if (box.checked) answer.classList.remove("hidden");

    card.append(bar, body);
    return card;
  }

  async function openGuide() {
    if (!currentSession) return;
    $("drawer-title").textContent = "跟练模式";
    $("scrim").classList.add("open");
    $("drawer").classList.add("open");
    const body = $("guide-body");
    body.innerHTML = '<div class="empty">加载中…</div>';
    try {
      const response = await fetch(`/api/arena/sessions/${currentSession}/guide`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const steps = await response.json();
      let done = {};
      try {
        done = JSON.parse(localStorage.getItem(`arena:guide:${currentSession}`) || "{}");
      } catch {
        done = {};
      }
      body.innerHTML = "";
      steps.forEach((step) => body.appendChild(stepCard(step, done)));
    } catch (error) {
      body.innerHTML = `<div class="empty">生成失败：${error.message}</div>`;
    }
  }

  function closeGuide() {
    $("scrim").classList.remove("open");
    $("drawer").classList.remove("open");
  }

  async function flipState(path) {
    if (!currentSession) return;
    try {
      const response = await fetch(path, { method: "POST" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const session = await response.json();
      setStatus(session.status, session.status === "VERIFIED" ? "ok" : "run");
    } catch {
      setStatus("ERROR", "bad");
    }
  }

  $("guide").addEventListener("click", openGuide);
  $("close-guide").addEventListener("click", closeGuide);
  $("scrim").addEventListener("click", closeGuide);
  $("restore").addEventListener("click", () =>
    flipState(`/api/arena/sessions/${currentSession}/restore`),
  );
  $("patch").addEventListener("click", () =>
    flipState(`/api/arena/sessions/${currentSession}/apply-patch`),
  );

  async function openReview() {
    if (!currentSession) return;
    $("drawer-title").textContent = "复盘";
    $("scrim").classList.add("open");
    $("drawer").classList.add("open");
    const body = $("guide-body");
    body.innerHTML = '<div class="empty">正在整理复盘…</div>';
    try {
      const response = await fetch(`/api/arena/sessions/${currentSession}/review`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const review = await response.json();
      body.innerHTML = "";

      const head = document.createElement("div");
      head.className = "step";
      const bar = document.createElement("div");
      bar.className = "bar";
      const title = document.createElement("span");
      title.className = "t";
      title.textContent = `结论：${review.verdict}`;
      const cost = document.createElement("span");
      cost.className = "exp";
      cost.textContent = `${review.cost_ms} ms`;
      bar.append(title, cost);
      const cnt = document.createElement("div");
      cnt.className = "cnt";
      cnt.append(labelled("一句话总结：", review.headline, "brief"));
      cnt.append(labelled("入口：", review.entry_point, "note"));
      cnt.append(
        labelled("网关新增规则：", review.rules.join("  ") || "无", "note"),
        labelled("关闭的缺陷：", review.flags_off.join(", ") || "无", "note"),
      );
      head.append(bar, cnt);
      body.append(head);

      review.steps.forEach((step) => {
        const card = document.createElement("article");
        card.className = "step";
        const head2 = document.createElement("div");
        head2.className = "bar";
        head2.innerHTML = `<span class="n">#${step.step}</span><span class="t"></span>`;
        head2.querySelector(".t").textContent = step.label;
        const inner = document.createElement("div");
        inner.className = "cnt";
        inner.append(
          labelled("做了什么：", step.action, "note"),
          labelled("结果：", step.result, "expect"),
          labelled("学到什么：", step.lesson, "brief"),
          labelled("怎么防：", step.defense, "note"),
        );
        card.append(head2, inner);
        body.append(card);
      });
    } catch (error) {
      body.innerHTML = `<div class="empty">复盘生成失败：${error.message}</div>`;
    }
  }

  $("review").addEventListener("click", openReview);
  $("start").addEventListener("click", start);
  boot();
})();
</script>
</body>
</html>
