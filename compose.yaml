services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VULNARENA_DATABASE_URL: postgresql+asyncpg://vulnarena:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/vulnarena
      VULNARENA_REDIS_URL: redis://redis:6379/0
      VULNARENA_NVD_API_KEY: ${VULNARENA_NVD_API_KEY:-}
      VULNARENA_ADMIN_TOKEN: ${VULNARENA_ADMIN_TOKEN:?Set VULNARENA_ADMIN_TOKEN in .env for container access}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      VULNARENA_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vulnarena
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-vulnarena.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vulnarena"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
