name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vulnarena_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: vulnarena_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vulnarena_test -d vulnarena_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vulnarena_test:ci-test-only@127.0.0.1:5432/vulnarena_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      POSTGRES_PASSWORD: ci-container-only
      POSTGRES_ADMIN_PASSWORD: ci-container-admin-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
      - run: docker build -t vulnarena:ci .
      - name: Container health and non-root smoke test
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          test "$(docker compose exec -T api id -u)" = "10001"
          curl --fail http://127.0.0.1:8000/health
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: verification/coverage.xml
